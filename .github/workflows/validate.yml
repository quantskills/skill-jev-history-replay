name: validate

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # 评测本身不需要 panda_data：对齐与回放是纯标准库实现。
      - name: Install test deps
        run: pip install -r requirements-dev.txt
      - name: Environment self-check
        run: python scripts/env_check.py
      - name: Contract validation
        run: python scripts/validate.py
      # build 必须在 tests 之前：per_day 校验要读 output/ledger.jsonl
      - name: Full alignment run
        run: python scripts/build.py
      - name: Unit tests (fast)
        run: python -m pytest tests/ -v -m "not slow"
      - name: "Unit tests (slow: verdict discrimination)"
        run: python -m pytest tests/ -v -m slow
      - name: Verify validation-doc claims
        run: python scripts/verify_claims.py
      - name: Verdict discrimination controls
        run: python scripts/controls_check.py --quick
      - name: Per-trade price / return audit
        run: python scripts/trade_audit.py --sample 300
      - name: Knob efficacy (every semantics knob must matter)
        run: python scripts/knob_efficacy.py --days 2
      - name: Data quality audit (offline)
        run: python scripts/data_quality_audit.py --offline
      - name: Assert report shape
        run: |
          python - <<'PY'
          import json
          report = json.load(open("output/report.json"))
          for key in ("provenance", "comparability", "ledger", "attribution",
                      "alignment_conclusion", "value_assessment", "applicability"):
              assert key in report, f"missing {key}"
          assert report["alignment_conclusion"]["verdict"] == "inconclusive", \
              "synthetic logs must not yield a determinate alignment verdict"
          assert report["comparability"]["config_hash"], "config_hash missing"
          print("report shape ok")
          PY
      - name: Release hygiene
        run: |
          test -f README.en.md
          test -f LICENSE
          test -f INSTALL.md
          test -f agents/cursor-rule.mdc
          test -f agents/portable-loader.md
          test -f agents/openai.yaml
          grep -q '"license": "GPL-3.0-only"' skill.json
          grep -q 'license: GPL-3.0-only' SKILL.md
          head -1 LICENSE | grep -q "GNU GENERAL PUBLIC LICENSE"
          # 免责声明四项：研究用途 / 不保证收益 / 风险边界 / 非官方背书
          python - <<'PY'
          import sys, pathlib
          readme = pathlib.Path("README.md").read_text(encoding="utf-8")
          en = pathlib.Path("README.en.md").read_text(encoding="utf-8")
          zh_terms = ["免责声明", "不构成", "不保证收益", "风险", "非官方背书"]
          en_terms = ["Disclaimer", "not investment advice",
                      "No performance guarantee", "Risk boundary",
                      "No official endorsement"]
          missing = ([t for t in zh_terms if t not in readme]
                     + [t for t in en_terms if t not in en])
          assert not missing, f"免责声明缺项：{missing}"
          # INSTALL.md 必须覆盖 5 个平台
          inst = pathlib.Path("INSTALL.md").read_text(encoding="utf-8")
          platforms = ["Claude Code", "Codex", "Cursor", "Hermes", "OpenClaw"]
          gap = [p for p in platforms if p not in inst]
          assert not gap, f"INSTALL.md 未覆盖平台：{gap}"
          print("release hygiene: disclaimers and platforms ok")
          PY
