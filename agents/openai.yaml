openapi: 3.1.0
info:
  title: skill-jev-history-replay
  description: Align JEV's recorded watch conditions with a deterministic historical replayer and attribute every difference to one explicit interpretation knob (timestamp convention, baseline price, breakout field/window, persistence, wait bars, entry price, exit evaluation, T+1, cooldown). Emits a five-axis difference ledger plus single-knob ablation.
  version: 0.17.0

x-skill-info:
  name: skill-jev-history-replay
  type: build
  category: evaluation
  entry: scripts/build.py
  tags: [quant, build, evaluation, replay, semantic-alignment, difference-ledger]

x-steps:
  - id: align
    script: scripts/build.py
    description: Run replay, align against JEV logs, attribute divergences, and emit report.json plus ledger.jsonl
    args:
      bars_dir: "fixtures/bars"
      logs_dir: "fixtures/logs"
      output_dir: "output/"
    auth_required: false
    output: "output/report.json, output/ledger.jsonl"

  - id: validate_contract
    script: scripts/validate.py
    description: Validate the bars and log contract, separating missing-field errors from semantic divergence
    args: "--bars-dir fixtures/bars --logs-dir fixtures/logs"
    auth_required: false

  - id: self_check
    script: scripts/env_check.py
    description: Report environment readiness as structured JSON; no network or login is required
    args: "--json"
    auth_required: false

  - id: compare_baseline
    script: scripts/compare_baseline.py
    description: Freeze a run or compare against a frozen baseline; refuses to interpret deltas when config_hash differs
    args: "freeze output/report.json --name v1"
    auth_required: false

  - id: fetch_data
    script: scripts/fetch_data.py
    description: Turn MCP-fetched JSON (get_stock_min / get_stock_daily / get_prev_trade_date) into bar fixtures
    args: "--date 20261112 --from-mcp /tmp/mcp"
    auth_required: false

  - id: build_fixtures
    script: scripts/build_fixtures.py
    description: Regenerate bars, reference prices and synthetic logs from an MCP-fetched JSON directory
    args: "--date 20261112 --from-mcp /tmp/mcp --universe 300"
    auth_required: false

x-preflight:
  # Mirror of the "## 前置检查" section in SKILL.md. Work through it in order and
  # stop at the first failing item: report only what is missing, never switch data
  # sources and never degrade silently.
  host: QuantStudio
  stop_on_failure: true
  items:
    - id: runtime
      check: "QuantStudio host with Python >= 3.10 (scripts/env_check.py)"
      on_fail: stop
    - id: dependencies
      check: "core path is standard-library only; tests need `import pytest`"
      on_fail: stop
    - id: mcp_session
      check: "mcp__pandadata__auth_status -> ok: true and reauth_required: false"
      blocking_when: "refetching bars or rebuilding fixtures"
      on_fail: "stop; tell the user to log in via Settings -> PandaData; never ask the user for credentials"
    - id: permission_probe
      check: "one minimal get_prev_trade_date call; data_permission_required means stop"
      blocking_when: "refetching bars or rebuilding fixtures"
      on_fail: "relay the returned message and purchase entry point verbatim"
    - id: offline_replay
      check: "fixtures/bars non-empty; missing logs or reference prices stay warnings"
      blocking_when: null
      on_fail: "state the fixture landing date and that acquisition was not re-verified"
    - id: jev_log_source
      check: "actual JEV condition/judgement logs confirmed; otherwise synthetic mode"
      on_fail: "alignment_conclusion must stay inconclusive"

x-semantics-knobs:
  # 语义配置项全集，与 scripts/config.py 的 REFERENCE_SEMANTICS 一致（23 项）
  - bar_timestamp
  - baseline_price
  - breakout_field
  - breakout_window
  - breakout_includes_current
  - persistence_bars
  - warmup_bars
  - signal_gain_pct
  - wait_bars
  - entry_price
  - exit_eval
  - stop_loss_pct
  - take_profit_pct
  - max_hold_bars
  - cooldown_bars
  - no_entry_after
  - force_exit_time
  - t_plus_1
  - fee_bps
  - slippage_bps
  - initial_capital
  - position_pct
  - lot_size

x-attribution-knobs:
  # 可做单旋钮消融归因的子集，与 scripts/semantics.py 的 KNOB_VALUES 一致（10 项）
  # 其余项目是阈值/资金参数，改动它们不构成"解释选择"，不适合做归因。
  - bar_timestamp
  - baseline_price
  - breakout_field
  - breakout_includes_current
  - persistence_bars
  - wait_bars
  - entry_price
  - exit_eval
  - t_plus_1
  - cooldown_bars

x-outputs:
  - format: json
    path: output/report.json
    description: Provenance, comparability, ledger aggregate, attribution, alignment conclusion, value assessment, applicability
  - format: jsonl
    path: output/ledger.jsonl
    description: Per-item difference ledger across condition / signal / wait / entry / exit

x-evaluation-policy:
  mode: replay-only
  live_trading_access: false
  note: "只读对齐：不假设可访问 JEV 内部推理或自定义 API。对齐基于本地夹具与调用方日志，全程不连接实盘、不产生委托。日志为 synthetic 时对齐结论恒为 inconclusive。跨 run 比对须保持 semantics_hash、夹具指纹、容差与日志来源一致。"
  models_under_test:
    - id: deterministic-replayer
      role: subject

x-requirements:
  runtime: python >= 3.10
  packages:
    - (no runtime third-party dependency)
    - pyyaml (optional)
    - pytest (dev)
  mcp:
    server: pandadata
    transport: streamable-http
    auth: oauth
    tools:
      - mcp__pandadata__auth_status
      - mcp__pandadata__search_methods
      - mcp__pandadata__get_method_doc
      - mcp__pandadata__call_pandadata
    flow: auth_status -> search_methods -> get_method_doc -> call_pandadata
    methods:
      - get_stock_min
      - get_stock_daily
      - get_prev_trade_date
      - get_trade_list
      - get_st_list
      - get_suspended_list
    note: "结果按窄日期区间分批取；truncated=true 时 scripts/mcp_source.py 抛 truncated_result。落盘后用 fetch_data.py --from-mcp 生成夹具。" 